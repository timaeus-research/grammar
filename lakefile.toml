name = "grammar"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Grammar"]
enableArtifactCache = true

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[require]]
name = "hironaka"
git = "https://github.com/timaeus-research/hironaka"
rev = "aa4087ede4169735400431486543f1391734bcae"

[[lean_lib]]
name = "Grammar"
