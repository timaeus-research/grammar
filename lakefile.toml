name = "grammar"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Grammar"]
enableArtifactCache = true

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[require]]
name = "hironaka"
git = "https://github.com/timaeus-research/hironaka"
rev = "eb9b6ca3dd9d13a909ab739a474d64a5d4c9dee1"

[[require]]
name = "strucdual"
git = "https://github.com/timaeus-research/strucdual"
rev = "4f317b3f66701f58c6af08f1dddd9483541b8a09"

[[lean_lib]]
name = "Grammar"
